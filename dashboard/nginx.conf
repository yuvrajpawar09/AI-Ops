server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Phase 8: the browser now talks to one origin only. Both backends are
    # reverse-proxied under /api/, which is what makes a SameSite=Strict
    # session cookie usable - a cross-origin call to localhost:8100 would be
    # a different site to the browser and the cookie would never be sent.
    location /api/rca/ {
        proxy_pass http://rca-agent:8100/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    location /api/detector/ {
        proxy_pass http://anomaly-detector:8000/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    # Single-page app: any path that isn't a real static file falls back to
    # index.html so client-side routing (/, /login, /app) doesn't 404 on a
    # hard refresh or a deep link.
    location / {
        try_files $uri $uri/ /index.html;
    }

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
}
