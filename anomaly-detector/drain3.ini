; Drain3 configuration, shared by the live service (app/drain_parser.py) and
; training/train.py so a template ID means the same thing whether it was
; assigned while training or later during live inference.

[SNAPSHOT]
; How often the in-memory cluster tree is flushed to models/drain3_state.bin.
snapshot_interval_minutes = 1
compress_state = True

[MASKING]
; Regex substitutions applied BEFORE clustering, so obviously-variable tokens
; (UUIDs, numbers) always get treated as wildcards instead of relying on
; Drain's structural heuristics to notice they vary. Order matters: UUID
; before NUM, since a UUID also matches digit-heavy substrings.
masking = [
          {"regex_pattern":"((?<=[^A-Za-z0-9])|^)([0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12})((?=[^A-Za-z0-9])|$)", "mask_with": "UUID"},
          {"regex_pattern":"((?<=[^A-Za-z0-9])|^)(-?\\d+\\.\\d+)((?=[^A-Za-z0-9])|$)", "mask_with": "FLOAT"},
          {"regex_pattern":"((?<=[^A-Za-z0-9])|^)(-?\\d+)((?=[^A-Za-z0-9])|$)", "mask_with": "NUM"}
          ]
mask_prefix = <
mask_suffix = >

[DRAIN]
; Similarity threshold for joining an existing cluster (0-1, higher = stricter).
sim_th = 0.4
; Max depth of the prefix tree - deeper distinguishes more before falling
; back to similarity matching.
depth = 4
max_children = 100
max_clusters = 1024
; Our own log messages use "key=value" formatting, e.g.
; "(product=PROD-1, qty=2, amount=499.0)" - splitting on "=" too (in addition
; to the default whitespace/punctuation delimiters) lets Drain wildcard the
; value without swallowing the "product=" key into the variable token.
extra_delimiters = ["="]
