services:
  notification-service:
    build: ./services/notification-service
    container_name: notification-service
    ports:
      - "8084:8084"
    labels:
      # Filebeat's Docker autodiscover (log-pipeline/filebeat.yml) only attaches
      # a log input to containers carrying this label, so Kafka/Zookeeper/Filebeat's
      # own noise never ends up in the "logs" topic.
      aiops_log: "true"
    networks:
      - aiops-net
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8084/actuator/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  inventory-service:
    build: ./services/inventory-service
    container_name: inventory-service
    ports:
      - "8083:8083"
    labels:
      aiops_log: "true"
    environment:
      # Phase 8: /admin/restock and /admin/inventory now require this key.
      # Unset or placeholder and the service refuses to start.
      SERVICE_API_KEY: ${SERVICE_API_KEY:?set SERVICE_API_KEY in .env - see .env.example}
    networks:
      - aiops-net
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8083/actuator/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  payment-service:
    build: ./services/payment-service
    container_name: payment-service
    ports:
      - "8082:8082"
    labels:
      aiops_log: "true"
    environment:
      # Overrides application.yml's localhost default: inside the Docker
      # network, services reach each other by container name, not localhost.
      NOTIFICATION_SERVICE_URL: http://notification-service:8084
    networks:
      - aiops-net
    depends_on:
      notification-service:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8082/actuator/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  order-service:
    build: ./services/order-service
    container_name: order-service
    ports:
      - "8081:8081"
    labels:
      aiops_log: "true"
    environment:
      PAYMENT_SERVICE_URL: http://payment-service:8082
      INVENTORY_SERVICE_URL: http://inventory-service:8083
      # Phase 8: /admin/config now requires this key.
      SERVICE_API_KEY: ${SERVICE_API_KEY:?set SERVICE_API_KEY in .env - see .env.example}
    networks:
      - aiops-net
    depends_on:
      payment-service:
        condition: service_healthy
      inventory-service:
        condition: service_healthy
    healthcheck:
      # Added in Phase 6: rca-agent now calls order-service directly
      # (admin/config + verification orders), so something needs to depend
      # on it being healthy the way payment/inventory/notification already do.
      test: ["CMD", "wget", "-qO-", "http://localhost:8081/actuator/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  # ---------------------------------------------------------------------------
  # Phase 2: Kafka log pipeline
  # ---------------------------------------------------------------------------

  zookeeper:
    image: confluentinc/cp-zookeeper:7.6.1
    container_name: zookeeper
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    networks:
      - aiops-net

  kafka:
    image: confluentinc/cp-kafka:7.6.1
    container_name: kafka
    # After a `docker compose stop` + `start`, Zookeeper restores the broker's
    # ephemeral znode from its snapshot before the old session has expired, so
    # Kafka's registerBroker hits NodeExistsException and exits(1) - taking
    # kafka-init, filebeat, anomaly-detector and rca-agent down with it. One
    # retry is enough: by then Zookeeper has expired the stale session. Bounded
    # so a genuine misconfiguration still fails loudly instead of looping.
    restart: "on-failure:3"
    depends_on:
      - zookeeper
    ports:
      # Exposed to the host so tools running outside Docker (e.g. the Python
      # consumer_test.py script) can connect to localhost:9092.
      - "9092:9092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      # Two listeners: PLAINTEXT is what containers on aiops-net use to reach
      # Kafka via the hostname "kafka"; PLAINTEXT_HOST is what the host machine
      # uses via "localhost". Kafka advertises different addresses on each so
      # both sides can resolve the broker correctly after the initial connect.
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:29092,PLAINTEXT_HOST://0.0.0.0:9092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:9092
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      # Topics are created explicitly by kafka-init below, not implicitly on
      # first write - keeps topic config (partitions/replication) intentional.
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
    networks:
      - aiops-net
    healthcheck:
      test: ["CMD", "kafka-broker-api-versions", "--bootstrap-server", "localhost:9092"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  # One-shot job: creates the "logs" topic then exits. Runs the same cp-kafka
  # image (it ships the kafka-topics CLI) purely as a client, not as a broker.
  kafka-init:
    image: confluentinc/cp-kafka:7.6.1
    container_name: kafka-init
    depends_on:
      kafka:
        condition: service_healthy
    entrypoint: ["bash", "-c"]
    command:
      - |
        kafka-topics --bootstrap-server kafka:29092 --create --if-not-exists \
          --topic logs --partitions 3 --replication-factor 1
        kafka-topics --bootstrap-server kafka:29092 --describe --topic logs
    networks:
      - aiops-net

  filebeat:
    image: docker.elastic.co/beats/filebeat:8.13.4
    container_name: filebeat
    # The official image drops root privileges by default, but reading other
    # containers' log files under /var/lib/docker/containers requires root.
    user: root
    environment:
      # Beats 8.13.4 bundles a Docker client that mis-negotiates the API
      # version against newer Docker Desktop engines, failing with an empty
      # "Error response from daemon: " on startup. Pinning to a version both
      # sides support (Docker Desktop's own reported floor is 1.44) fixes it.
      # Verified against Docker Desktop 4.62 / Engine 29.2.1 (API 1.53).
      DOCKER_API_VERSION: "1.44"
    volumes:
      - ./log-pipeline/filebeat.yml:/usr/share/filebeat/filebeat.yml:ro
      # Where Docker's json-file logging driver actually writes container logs.
      - /var/lib/docker/containers:/var/lib/docker/containers:ro
      # Lets Filebeat's Docker autodiscover watch container start/stop events
      # and read labels, so it knows which containers to attach a log input to.
      - /var/run/docker.sock:/var/run/docker.sock:ro
    # --strict.perms=false: skip Filebeat's config-file permission check, which
    # assumes Unix-style permission bits that don't map cleanly when the config
    # is bind-mounted from a Windows host.
    command: ["--strict.perms=false"]
    depends_on:
      kafka-init:
        condition: service_completed_successfully
    networks:
      - aiops-net

  # ---------------------------------------------------------------------------
  # Phase 3: anomaly detection service
  # ---------------------------------------------------------------------------

  anomaly-detector:
    build: ./anomaly-detector
    container_name: anomaly-detector
    # Deliberately NOT labeled aiops_log=true: its own logs are plain Python
    # text, not the app's JSON schema, and it's the consumer of the "logs"
    # topic - shipping its own output back in would be a feedback loop.
    ports:
      - "8000:8000"
    environment:
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      KAFKA_TOPIC: logs
      # Phase 8: /anomalies is authenticated. The same JWT_SECRET rca-agent
      # signs sessions with is used here to verify them, and SERVICE_API_KEY
      # lets rca-agent's poller and the benchmark scripts read the feed.
      JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET in .env - see .env.example}
      SERVICE_API_KEY: ${SERVICE_API_KEY:?set SERVICE_API_KEY in .env - see .env.example}
    volumes:
      # Shared with training/train.py (run via `docker compose run`), so a
      # freshly trained model/threshold/Drain3 state persists across
      # container restarts and is visible to both.
      - ./anomaly-detector/models:/app/models
    depends_on:
      kafka-init:
        condition: service_completed_successfully
    networks:
      - aiops-net
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  # ---------------------------------------------------------------------------
  # Phase 4: LLM root cause analysis agent
  # ---------------------------------------------------------------------------

  ollama:
    image: ollama/ollama:latest
    container_name: ollama
    ports:
      - "11434:11434"
    volumes:
      # Named volume so a pulled model survives container recreation -
      # without this, qwen2.5:3b (~2GB) would re-download every restart.
      - ollama-models:/root/.ollama
    networks:
      - aiops-net

  # One-shot job: waits for the Ollama server to accept connections, then
  # pulls the model - so `docker compose up` alone is enough, with no
  # separate manual `ollama pull` step to remember before a demo.
  ollama-init:
    image: ollama/ollama:latest
    container_name: ollama-init
    depends_on:
      - ollama
    environment:
      OLLAMA_HOST: "ollama:11434"
    entrypoint: ["sh", "-c"]
    command:
      - |
        until ollama list >/dev/null 2>&1; do
          echo "Waiting for Ollama server..."
          sleep 2
        done
        ollama pull qwen2.5:3b
    networks:
      - aiops-net

  rca-agent:
    build: ./rca-agent
    container_name: rca-agent
    # Deliberately NOT labeled aiops_log=true, same reasoning as
    # anomaly-detector: plain Python logs, not the app's JSON schema.
    ports:
      - "8100:8100"
    environment:
      ANOMALY_DETECTOR_URL: http://anomaly-detector:8000
      OLLAMA_URL: http://ollama:11434
      OLLAMA_MODEL: qwen2.5:3b
      # Phase 6: auto-remediation targets - rca-agent's playbooks call these
      # admin endpoints directly.
      ORDER_SERVICE_URL: http://order-service:8081
      INVENTORY_SERVICE_URL: http://inventory-service:8083
      # Phase 8: issues and verifies session JWTs, holds the service key its
      # playbooks present to the two admin surfaces, and seeds the first
      # ADMIN account into the SQLite users table on an empty database.
      JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET in .env - see .env.example}
      SERVICE_API_KEY: ${SERVICE_API_KEY:?set SERVICE_API_KEY in .env - see .env.example}
      ADMIN_USERNAME: ${ADMIN_USERNAME:?set ADMIN_USERNAME in .env - see .env.example}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?set ADMIN_PASSWORD in .env - see .env.example}
      USERS_DB_PATH: /data/users.db
    volumes:
      # Named volume so the users table survives container recreation.
      - rca-data:/data
    depends_on:
      anomaly-detector:
        condition: service_healthy
      order-service:
        condition: service_healthy
      inventory-service:
        condition: service_healthy
      ollama-init:
        condition: service_completed_successfully
    networks:
      - aiops-net
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8100/health')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  # ---------------------------------------------------------------------------
  # Phase 5: dashboard
  # ---------------------------------------------------------------------------

  dashboard:
    # Phase 8: nothing host-specific is baked into the bundle any more. nginx
    # in this container reverse-proxies /api/rca and /api/detector to the two
    # backends over aiops-net, so the browser only ever talks to port 3000.
    build: ./dashboard
    container_name: dashboard
    ports:
      - "3000:80"
    networks:
      - aiops-net
    depends_on:
      anomaly-detector:
        condition: service_healthy
      rca-agent:
        condition: service_healthy

networks:
  aiops-net:
    driver: bridge

volumes:
  ollama-models:
  rca-data:
